name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test every effect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs each effect in headless Chrome (preinstalled on the runner), in
      # demo mode and on the scripted fake tracker.
      - run: npm test
