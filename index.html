<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finger Frame Effect</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0d10; overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #status {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(10, 12, 16, 0.65); backdrop-filter: blur(8px);
    color: #e8ecf1; font-size: 13px; letter-spacing: 0.02em;
    border: 1px solid rgba(255,255,255,0.08);
    transition: opacity 0.4s ease; pointer-events: none; white-space: nowrap;
  }
  #status.hidden { opacity: 0; }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px;
    max-width: calc(100vw - 24px);
    background: rgba(10, 12, 16, 0.65); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    user-select: none;
  }
  #hint .fx {
    padding: 6px 12px; border-radius: 9px; cursor: pointer;
    color: #9aa4b0; font-size: 12.5px; line-height: 1; white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #hint .fx:hover { color: #e8ecf1; }
  #hint .fx.active { background: rgba(255,255,255,0.14); color: #ffffff; }
  #hint .fx .k {
    display: inline-block; margin-right: 7px; opacity: 0.55;
    font-size: 11px; font-variant-numeric: tabular-nums;
  }

  #badge {
    position: fixed; top: 18px; right: 18px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(255, 170, 60, 0.15); color: #ffc46b;
    border: 1px solid rgba(255, 170, 60, 0.35);
    font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    display: none;
  }
  #badge.show { display: block; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted style="display:none"></video>
  <div id="status">Loading hand tracker…</div>
  <div id="badge">demo mode</div>
  <div id="hint"></div>
  <!-- Cache-bust on every load: without this the browser keeps serving a
       stale main.js after an edit, which silently hides new effects. -->
  <script type="module">
    import("./main.js?v=" + Date.now());
  </script>
</body>
</html>
